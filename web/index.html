<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GFS Trend Viewer</title>
    <meta name="description" content="GFS forecasts for jet-stream wind, temperature, surface wind, and precipitation, and how each has changed between model runs." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  </head>
  <body>
    <div class="app" id="app" data-state="loading">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div>
            <div class="brand-name">GFS Trend Viewer</div>
            <div class="brand-sub">Forecasts and how they changed from run to run</div>
          </div>
        </div>
        <div class="updated" id="updated"></div>
      </header>

      <main class="layout">
        <section class="map-col" aria-label="Map">
          <nav class="tabs" id="tabs" role="tablist" aria-label="Products"></nav>
          <h1 class="title" id="title">Loading…</h1>
          <div class="map-wrap" id="map-wrap">
            <canvas id="map" aria-label="Map of the change in 250 mb wind speed"></canvas>
            <div class="banner" id="banner" role="status" hidden></div>
            <div class="tooltip" id="tooltip" hidden></div>
            <div class="spinner" id="spinner" hidden aria-hidden="true"></div>
          </div>
          <div class="colorbar" id="colorbar"></div>
          <div class="cb-caption" id="cb-caption"></div>

          <div class="timeline">
            <button class="icon-btn" id="prev" type="button" aria-label="Previous forecast hour (Left arrow)">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4.5 7 10l5.5 5.5" /></svg>
            </button>
            <div class="slider-box">
              <input type="range" id="fhr" aria-label="Forecast hour" />
              <div class="ticks" id="ticks" aria-hidden="true"></div>
            </div>
            <button class="icon-btn" id="next" type="button" aria-label="Next forecast hour (Right arrow)">
              <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7.5 4.5 13 10l-5.5 5.5" /></svg>
            </button>
            <div class="fhr-readout" id="fhr-readout" aria-live="polite"></div>
          </div>
        </section>

        <aside class="panel" aria-label="Controls">
          <div class="field" id="mode-field">
            <div class="field-label" id="mode-label">Show</div>
            <div class="segmented" id="mode" role="radiogroup" aria-labelledby="mode-label"></div>
          </div>

          <div class="field" id="var-field" hidden>
            <div class="field-label" id="var-label">Variable</div>
            <div class="segmented" id="var" role="radiogroup" aria-labelledby="var-label"></div>
          </div>

          <div class="field">
            <label class="field-label" for="run">Current run</label>
            <select id="run"></select>
          </div>

          <div class="field" id="lag-field">
            <div class="field-label" id="lag-label">Compare with run from</div>
            <div class="segmented" id="lag" role="radiogroup" aria-labelledby="lag-label"></div>
            <div class="hint" id="lag-hint"></div>
          </div>

          <div class="field" id="iso-field">
            <div class="field-label" id="iso-label">Isotachs (current run, kt)</div>
            <div class="chips" id="iso" role="group" aria-labelledby="iso-label"></div>
          </div>

          <div class="field" id="overlays-field">
            <div class="field-label">Overlays</div>
            <div class="checks" id="overlays"></div>
          </div>

          <div class="field" id="lim-field">
            <div class="field-label" id="lim-label">Color scale</div>
            <div class="segmented" id="lim" role="radiogroup" aria-labelledby="lim-label"></div>
          </div>

          <div class="field stats" id="stats" aria-live="polite"></div>

          <div class="explain">
            <div id="explain-view"></div>
            <p class="keys"><kbd>←</kbd> <kbd>→</kbd> step 6 h · <kbd>1</kbd>–<kbd>4</kbd> tabs · <kbd>Home</kbd> <kbd>End</kbd></p>
          </div>
        </aside>
      </main>
      <footer class="footer">
        Data: NOAA GFS 0.25° via the NOAA Open Data Dissemination program on AWS. Basemap: Natural Earth.
      </footer>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
