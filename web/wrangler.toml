# The site: the viewer and the daily games, served as static assets by a
# Worker with no script (requests to static assets aren't billed). Deployed by
# .github/workflows/pages.yml after the e2e passes. The data comes from R2 at
# data.runtorunwx.com, not from here.
name = "runtorunwx-site"
compatibility_date = "2026-09-28"
# Only the custom domains below: no workers.dev copy of the site
workers_dev = false
preview_urls = false

# www redirects to the apex with a Cloudflare redirect rule, which runs before
# the Worker (build plan, Phase 4.5 task 1)
routes = [
  { pattern = "runtorunwx.com", custom_domain = true },
  { pattern = "www.runtorunwx.com", custom_domain = true },
]

[assets]
directory = "./dist"
# /play/spot -> /play/spot/, as GitHub Pages did
html_handling = "auto-trailing-slash"
not_found_handling = "none"
