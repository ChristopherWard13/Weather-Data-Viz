[project]
name = "wxtrend"
version = "0.1.0"
description = "Fetch global, AI and ensemble-mean forecast fields and publish compact frames for Run to Run Wx"
requires-python = ">=3.11"
dependencies = [
  "herbie-data>=2024.8.0",
  "cfgrib>=0.9.14",
  "eccodes>=2.38",
  "xarray>=2024.6",
  "numpy>=1.26",
  "requests>=2.31",
  "jsonschema>=4.21",
  "boto3>=1.36",
  "scipy>=1.13",
]

[project.scripts]
wxtrend = "wxtrend.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wxtrend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
