name: Daily games

# Wx Marks the Spot (build plan G1): yesterday's puzzle, from IEM's daily ASOS
# summaries, into R2 at games/spot/<date>.json and games/spot/latest.json.
# Each round's reveal map comes from GFS's analyses, fetched from NOAA's AWS
# bucket (about 20 s); a map that can't be fetched is left out, not waited for.
# The day must have ended everywhere in the Lower 48 (08Z) and IEM must have
# summarized it, so the main run fires at 10:30Z (6:30 a.m. Eastern in
# summer); the second run is a backup for a run GitHub dropped or delayed.
# A day R2 already has is left alone, since people may be playing it: the
# backup is a no-op after a good run (it only catches latest.json up, if a run
# died between the two uploads). A day that hasn't ended in the Lower 48 is
# refused. To remake a day by hand, run this with its date and "replace".
#
# Modeled or Measured (build plan G2): the same day's five pairs of maps, into
# games/measured/. The measured side is NOAA's URMA (on AWS, posted about 6-7 h
# late, so the day's 21Z analysis is up by about 04Z) and MRMS's 24-hour rain
# ending 06Z (up by about 07Z); the forecasts are GFS runs from 3 to 5 days
# earlier, from NOAA's AWS bucket. About a minute. A missing round is swapped
# for a spare; if a second one is missing too, the run fails rather than
# publish a short puzzle.
#
# Station ID (build plan G3): the same day's mystery city, into games/station/,
# from the NWS daily climate reports and IEM's ASOS summaries. It runs after
# Wx Marks the Spot because its clues leave out the fields that day's pin game
# shows, read from that puzzle in R2; if Wx Marks the Spot fails, Station ID is
# skipped, and the backup run makes both. A few seconds. Remaking only Wx Marks
# the Spot is refused when it would change the fields beside a published
# Station ID (its dry-day round follows the data); "all" remakes both. Station
# ID also leaves out Beat the Models' cities for the day and the two after.
#
# Beat the Models (build plan G4), into games/beat/, three steps for the day
# (each tried even if another fails; the job fails if any did): the verdict
# for it (the city's climate report; a report still missing on the third
# morning's try voids the day), the models' calls for the next day, whose lock
# passed at midnight (each model's own forecast from NOAA, ECMWF, DWD and
# ECCC; DWD keeps ICON's runs about a day, so this can't wait; a model that
# can't be read fails the job, and the backup run tries it again before
# leaving it out), and the puzzle for the day after, from this morning's 00Z
# runs. The puzzle needs Station ID's for the day (it leaves out that city),
# so this runs after the station job, whatever it did. About 15 s on the dev
# machine. The models' calls and verdicts are written once; "replace" remakes
# only the next day's puzzle, and only when Beat the Models is made alone
# (people may have made calls on it).
on:
  schedule:
    - cron: "30 10 * * *"
    - cron: "45 12 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: The day to make, YYYY-MM-DD (default yesterday)
        required: false
        type: string
      replace:
        description: Replace the day if R2 already has it
        required: false
        type: boolean
        default: false
      game:
        description: Which game to make (default all)
        required: false
        type: choice
        options: [all, spot, measured, station, beat]
        default: all

permissions:
  contents: read

concurrency:
  group: games
  cancel-in-progress: false

jobs:
  spot:
    name: Wx Marks the Spot
    # inputs.game is empty on a schedule
    if: inputs.game == '' || inputs.game == 'all' || inputs.game == 'spot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock

      - name: Make and publish the puzzle
        run: |
          args=(game spot --publish)
          if [ -n "$DAY" ]; then args+=(--date "$DAY"); fi
          if [ "$REPLACE" = "true" ]; then args+=(--replace); fi
          # Station ID's job remakes its puzzle next, beside the new fields
          if [ "$GAME" = "all" ]; then args+=(--station-follows); fi
          uv run --frozen wxtrend "${args[@]}"
        env:
          DAY: ${{ inputs.date }}
          REPLACE: ${{ inputs.replace }}
          GAME: ${{ inputs.game }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

  measured:
    name: Modeled or Measured
    if: inputs.game == '' || inputs.game == 'all' || inputs.game == 'measured'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock

      - name: Make and publish the puzzle
        run: |
          args=(game measured --publish)
          if [ -n "$DAY" ]; then args+=(--date "$DAY"); fi
          if [ "$REPLACE" = "true" ]; then args+=(--replace); fi
          uv run --frozen wxtrend "${args[@]}"
        env:
          DAY: ${{ inputs.date }}
          REPLACE: ${{ inputs.replace }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

  station:
    name: Station ID
    needs: spot
    # Made alone ("station"), it reads a pin game puzzle made earlier
    if: >-
      !cancelled() && needs.spot.result != 'failure'
      && (inputs.game == '' || inputs.game == 'all' || inputs.game == 'station')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock

      - name: Make and publish the puzzle
        run: |
          args=(game station --publish)
          if [ -n "$DAY" ]; then args+=(--date "$DAY"); fi
          if [ "$REPLACE" = "true" ]; then args+=(--replace); fi
          uv run --frozen wxtrend "${args[@]}"
        env:
          DAY: ${{ inputs.date }}
          REPLACE: ${{ inputs.replace }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

  beat:
    name: Beat the Models
    needs: station
    # Made alone ("beat"), it reads Station ID's puzzle made earlier
    if: >-
      !cancelled()
      && (inputs.game == '' || inputs.game == 'all' || inputs.game == 'beat')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock

      - name: Make and publish the day
        run: |
          args=(game beat --publish)
          if [ -n "$DAY" ]; then args+=(--date "$DAY"); fi
          # Remaking every game mustn't move a city people may have called
          if [ "$REPLACE" = "true" ] && [ "$GAME" = "beat" ]; then args+=(--replace); fi
          uv run --frozen wxtrend "${args[@]}"
        env:
          DAY: ${{ inputs.date }}
          REPLACE: ${{ inputs.replace }}
          GAME: ${{ inputs.game }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
