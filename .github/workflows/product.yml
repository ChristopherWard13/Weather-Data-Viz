name: Product update

# One pipeline pass for one product, straight into R2. Called by one small
# workflow per product (gfs.yml, ...), which sets the schedule and
# `concurrency: product-<id>`. It never builds or deploys the site, and keeps
# no data between runs: R2's manifest says what's already there.
on:
  workflow_call:
    inputs:
      product:
        description: Product id from config/models/*.json, e.g. gfs
        required: true
        type: string
      regrid:
        description: The product is regridded (config "regrid", e.g. GEFS's 0.5°), so keep its weights cached
        required: false
        type: boolean
        default: false
      timeout_minutes:
        description: Job timeout; NOMADS products need longer for a full backfill at their paced request rate
        required: false
        type: number
        default: 60
    secrets:
      R2_ACCOUNT_ID:
        required: true
      R2_ACCESS_KEY_ID:
        required: true
      R2_SECRET_ACCESS_KEY:
        required: true
      R2_BUCKET:
        required: true
      ARCHIVE_ACCESS_KEY_ID:
        required: true
      ARCHIVE_SECRET_ACCESS_KEY:
        required: true

permissions:
  contents: read

jobs:
  update:
    name: Update ${{ inputs.product }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    env:
      PRODUCT: ${{ inputs.product }}
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock

      # Regrid weights (regrid.py, .cache/regrid/*.npz) for products whose
      # source isn't on the display grid's spacing (GEFS 0.5°, GEM 0.15°,
      # ICON's icosahedral cells, whose coordinates are kept here too). They're
      # derived from the grids alone, so a miss only costs a rebuild (seconds,
      # and ICON's two coordinate files). The key changes with the display grids
      # and regrid.py; a new source grid under an old key is rebuilt each run
      # until one of those changes. 0.25° products are cropped and skip this.
      - name: Restore regrid weights
        if: inputs.regrid
        uses: actions/cache@v6
        with:
          path: .cache/regrid
          key: regrid-${{ inputs.product }}-${{ hashFiles('config/grids.json', 'pipeline/src/wxtrend/regrid.py') }}

      # Fetches only the frames R2's manifest doesn't list, then writes the new
      # manifest (R2's frames plus the new ones) to data/<product>/.
      - name: Run pipeline
        id: pipeline
        run: uv run --frozen wxtrend update --product "$PRODUCT" --remote
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

      - name: Verify manifest
        if: steps.pipeline.outputs.changed == 'true'
        run: uv run --frozen wxtrend verify --product "$PRODUCT" --remote
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

      # Uploads the new frames, then the manifest, then deletes dropped runs.
      - name: Sync to R2
        if: steps.pipeline.outputs.changed == 'true'
        run: uv run --frozen wxtrend sync --product "$PRODUCT"
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}

      # Copies into the private archive, from the public bucket, the frames it
      # should keep but doesn't (config "archive": every frame, or F000). It
      # runs whether or not anything changed, so a failed copy is retried by
      # the next job while the run is still public; and after the sync, so a
      # failure never holds up the site. The token reads the public bucket and
      # writes the archive.
      - name: Archive
        run: uv run --frozen wxtrend archive --product "$PRODUCT"
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          ARCHIVE_ACCESS_KEY_ID: ${{ secrets.ARCHIVE_ACCESS_KEY_ID }}
          ARCHIVE_SECRET_ACCESS_KEY: ${{ secrets.ARCHIVE_SECRET_ACCESS_KEY }}
          ARCHIVE_BUCKET: runtorunwx-archive

      - name: Summary
        if: always()
        env:
          LATEST: ${{ steps.pipeline.outputs.latest }}
          CHANGED: ${{ steps.pipeline.outputs.changed }}
        run: |
          echo "**$PRODUCT**: latest run ${LATEST:-unknown}; changed: ${CHANGED:-false}" >> "$GITHUB_STEP_SUMMARY"
