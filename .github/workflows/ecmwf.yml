name: ECMWF

# ECMWF IFS open data, 00/12Z runs (the ones that reach 360 h), from the
# Google Cloud mirror. A whole run lands at once, 7:34-7:36 after its init
# (object timestamps, 2026-10-07 to 10-11). The main run fires at T0+7:52
# (+15 min) with a retry at T0+8:37; the retry is a quick no-op when the first
# run already processed the cycle.
# GitHub can start scheduled runs hours late (3-5.5 h on 2026-10-11). A late
# run still does the right thing: it takes the latest complete cycle and fills
# in whatever the window is missing, so lateness costs freshness, never data.
on:
  schedule:
    - cron: "52 7,19 * * *"
    - cron: "37 8,20 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-ecmwf
  cancel-in-progress: false

jobs:
  update:
    uses: ./.github/workflows/product.yml
    with:
      product: ecmwf
    secrets:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
