name: Storage budget

# Fails when the public bucket or the private archive holds more than its
# budget (pipeline.storage_budget_gb in config/site.json; see
# pipeline/src/wxtrend/usage.py). A failed scheduled run gets GitHub to send an
# email, under this workflow's name. An alarm means deciding, never deleting:
# raise the archive's budget by hand as it grows. It lists every object in both
# buckets (about one request per thousand objects) with the archive's token,
# which reads both. GitHub may start it hours late, which doesn't matter for a
# daily check.
on:
  schedule:
    - cron: "47 15 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - run: uv run --frozen wxtrend storage
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          ARCHIVE_ACCESS_KEY_ID: ${{ secrets.ARCHIVE_ACCESS_KEY_ID }}
          ARCHIVE_SECRET_ACCESS_KEY: ${{ secrets.ARCHIVE_SECRET_ACCESS_KEY }}
          ARCHIVE_BUCKET: runtorunwx-archive
