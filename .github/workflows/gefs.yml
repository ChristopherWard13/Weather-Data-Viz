name: GEFS mean

# The GEFS ensemble mean (geavg, pgrb2ap5 at 0.5°, regridded to na025) from
# AWS. Every 6-hourly hour to 384 h is there 6:29-6:39 after each init, except
# 18Z, which took up to 7:33 (S3 timestamps, 16 cycles, 2026-10-08 to 10-11).
# The main run fires at T0+7:48 (latest + 15 min) with a retry at T0+8:33.
# GitHub can start scheduled runs hours late (3-5.5 h on 2026-10-11). A late
# run still does the right thing: it takes the latest complete cycle and fills
# in whatever the window is missing, so lateness costs freshness, never data.
on:
  schedule:
    - cron: "48 1,7,13,19 * * *"
    - cron: "33 2,8,14,20 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-gefs
  cancel-in-progress: false

jobs:
  update:
    uses: ./.github/workflows/product.yml
    with:
      product: gefs
      regrid: true
    secrets:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      ARCHIVE_ACCESS_KEY_ID: ${{ secrets.ARCHIVE_ACCESS_KEY_ID }}
      ARCHIVE_SECRET_ACCESS_KEY: ${{ secrets.ARCHIVE_SECRET_ACCESS_KEY }}
