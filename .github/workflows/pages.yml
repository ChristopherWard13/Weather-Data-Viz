name: Deploy site

# The site deploys only when its code changes. Data goes straight to R2 from
# the product workflows (gfs.yml, ...), and the site reads it from there
# (VITE_DATA_BASE in web/.env.production), so data updates never redeploy.
# It's served by Workers static assets (web/wrangler.toml), deployed with the
# scheduler's secrets: CLOUDFLARE_API_TOKEN, and R2's account id.
on:
  push:
    branches: [main]
    paths:
      - web/**
      - config/**
      - shared/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # A few hours of real data for every product, processed by the pipeline
      # from the sources (never R2): a pinned cycle and its lag runs, F000-F060.
      # NOMADS keeps days, not years, so AIGFS, AIGEFS and HGEFS come from a
      # frozen bundle on a GitHub release, pinned by SHA-256 in the Makefile.
      - name: Build the e2e dataset
        run: make e2e-data E2E_DATA="$RUNNER_TEMP/e2e-data"

      # Playwright builds the site to read ./data/, which the preview server
      # serves from the dataset above.
      - name: Browser tests
        working-directory: web
        run: npx playwright test
        env:
          CI: "true"
          WXTREND_DATA_DIR: ${{ runner.temp }}/e2e-data

      # The production build, which reads data from R2.
      - name: Build site
        working-directory: web
        run: npm run build

      - name: Deploy
        working-directory: web
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
