name: NOMADS probe

# One-off check (Phase 3) that NOMADS serves GitHub-hosted runners before any
# product depends on it. Run it by hand; delete it once the answer is recorded
# in docs/build-plan.md. About 12 requests in all, spaced 2 s apart, far inside
# NOMADS's 120 hits per minute per IP.
#
# What it checks, for yesterday's 12Z run at F006:
#   1. curl over HTTP/2 (expected to fail: NOMADS sends `content-length` with
#      trailing spaces, which curl's HTTP/2 parser rejects) and over HTTP/1.1
#   2. Python requests (HTTP/1.1, what the pipeline uses): each product's
#      .idx, then one multi-range GET for a few messages (multipart/byteranges)
on: workflow_dispatch

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock

      - name: curl
        run: |
          u="https://nomads.ncep.noaa.gov/pub/data/nccf/com/aigfs/prod/"
          echo "runner IP: $(curl -s https://api.ipify.org)"
          curl -sS -o /dev/null -w "HTTP/2:   %{http_code}, %{size_download} bytes\n" "$u" || echo "HTTP/2 failed (expected)"
          sleep 2
          curl -sS --http1.1 -o /dev/null -w "HTTP/1.1: %{http_code}, %{size_download} bytes\n" "$u"

      - name: requests, index and multi-range
        run: |
          uv run --frozen python - <<'EOF'
          import re, sys, time
          from datetime import datetime, timedelta, timezone
          import requests

          d = (datetime.now(timezone.utc) - timedelta(days=1)).strftime("%Y%m%d")
          base = "https://nomads.ncep.noaa.gov/pub/data/nccf/com"
          files = {
              "aigfs sfc": f"aigfs/prod/aigfs.{d}/12/model/atmos/grib2/aigfs.t12z.sfc.f006.grib2",
              "aigfs pres": f"aigfs/prod/aigfs.{d}/12/model/atmos/grib2/aigfs.t12z.pres.f006.grib2",
              "aigefs pres avg": f"aigefs/prod/aigefs.{d}/12/ensstat/products/atmos/grib2/aigefs.t12z.pres.avg.f006.grib2",
              "hgefs sfc avg": f"hgefs/prod/hgefs.{d}/12/ensstat/products/atmos/grib2/hgefs.t12z.sfc.avg.f006.grib2",
          }
          want = re.compile(r":(?:HGT:500 mb|TMP:850 mb|UGRD:250 mb|TMP:2 m above ground|PRMSL:mean sea level):")
          s, ok = requests.Session(), True
          for name, path in files.items():
              url = f"{base}/{path}"
              t = time.monotonic()
              idx = s.get(url + ".idx", timeout=60)
              lines = idx.text.splitlines()
              print(f"{name}: idx HTTP {idx.status_code}, {len(idx.content)} bytes, {len(lines)} messages, {time.monotonic() - t:.1f} s")
              if idx.status_code != 200 or not lines:
                  ok = False
                  continue
              offs = [int(l.split(":")[1]) for l in lines]
              ranges = [f"{offs[i]}-{offs[i + 1] - 1}" for i, l in enumerate(lines[:-1]) if want.search(l)]
              time.sleep(2)
              t = time.monotonic()
              r = s.get(url, headers={"Range": "bytes=" + ",".join(ranges)}, timeout=120)
              print(f"  {len(ranges)} ranges: HTTP {r.status_code}, {r.headers.get('content-type')}, "
                    f"{len(r.content)} bytes, {time.monotonic() - t:.1f} s")
              ok &= r.status_code == 206 and len(r.content) > 0
              time.sleep(2)
          sys.exit(0 if ok else 1)
          EOF
