name: AIFS

# ECMWF AIFS Single open data, all four runs, from the Google Cloud mirror.
# Every hour to 360 h is there 5:23-5:39 after each 00/06/12/18Z init (object
# timestamps, 2026-10-07 to 10-11). The main run fires at T0+5:55 (+15 min)
# with a retry at T0+6:40; the retry is a quick no-op when the first run
# already processed the cycle.
# GitHub can start scheduled runs hours late (3-5.5 h on 2026-10-11). A late
# run still does the right thing: it takes the latest complete cycle and fills
# in whatever the window is missing, so lateness costs freshness, never data.
on:
  schedule:
    - cron: "55 5,11,17,23 * * *"
    - cron: "40 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-aifs
  cancel-in-progress: false

jobs:
  update:
    uses: ./.github/workflows/product.yml
    with:
      product: aifs
    secrets:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
