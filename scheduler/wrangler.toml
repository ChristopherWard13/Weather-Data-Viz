# The Worker that starts each product's update workflow when its next cycle is
# due (src/index.ts). Deployed by .github/workflows/scheduler.yml, which also
# uploads SCHEDULER_APP_ID and SCHEDULER_APP_KEY as Worker secrets.
name = "runtorunwx-scheduler"
main = "src/index.ts"
compatibility_date = "2026-09-28"
# Cron only: no public URL
workers_dev = false
preview_urls = false

[triggers]
crons = ["*/10 * * * *"]

[vars]
REPO = "ChristopherWard13/Weather-Data-Viz"
DATA_BASE = "https://data.runtorunwx.com/"

# src/products.json comes from the repo's config/
[build]
command = "node scripts/products.mjs"

[observability]
enabled = true
